<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Onboarding checklist loop</title>
<script>window.SCENE = { name: 'portrait-hr', width: 800, height: 800, fps: 30, duration: 6, kind: 'loop' };</script>
<style>
  html, body { width: 800px; height: 800px; margin: 0; overflow: hidden; background: #F7F4F1; }
  body { font-family: Inter, sans-serif; color: #141413; position: relative; }
  .abs { position: absolute; }
  .card { left: 150px; top: 195px; width: 500px; height: 390px; box-sizing: border-box; border-radius: 24px;
          background: #FCFBFA; box-shadow: 0 12px 24px rgba(0,0,0,0.06); }
  .head { left: 194px; right: 194px; top: 235px; height: 52px; display: flex; align-items: center; justify-content: space-between; }
  .head h1 { margin: 0; font-size: 40px; font-weight: 500; letter-spacing: -0.02em; }
  .count { position: relative; font-size: 26px; color: #6B6763; font-variant-numeric: tabular-nums; }
  .rule { left: 194px; width: 412px; top: 306px; height: 1.5px; background: #DDD6CD; }
  .band { left: 174px; width: 452px; height: 66px; margin-top: -33px; border-radius: 20px; background: #FEF3E2; }
  .row { left: 194px; height: 72px; margin-top: -36px; display: flex; align-items: center; gap: 20px;
         font-size: 28px; letter-spacing: -0.01em; white-space: nowrap; }
  .box { position: relative; width: 40px; height: 40px; flex: 0 0 40px; }
  .box .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid #DDD6CD; box-sizing: border-box; }
  .box .fill { position: absolute; inset: 0; border-radius: 50%; background: #E8940A; }
  .box svg { position: absolute; inset: 0; }
  .pill { left: 400px; top: 585px; height: 64px; margin-top: -32px; padding: 0 30px 0 24px; border-radius: 999px;
          background: #141413; color: #F7F4F1; display: flex; align-items: center; gap: 14px; font-size: 27px;
          font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; }
  .pill i { display: block; width: 12px; height: 12px; border-radius: 50%; background: #E8940A; }
</style>
</head>
<body>
  <div class="abs card"></div>
  <div class="abs head"><h1>Onboarding</h1><span class="count" id="count">0 of 3</span></div>
  <div class="abs rule"></div>
  <div class="abs band" id="band"></div>
  <div id="rows"></div>
  <div class="abs pill" id="pill"><i></i>Welcome aboard</div>
<script>
  function bez(x1, y1, x2, y2) {
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 10; i++) {
        const xt = 3*x1*t*(1-t)*(1-t) + 3*x2*t*t*(1-t) + t*t*t - x;
        const d = 3*x1*(1-t)*(1-t) + 6*(x2-x1)*t*(1-t) + 3*(1-x2)*t*t;
        if (Math.abs(d) < 1e-6) break;
        t = Math.min(1, Math.max(0, t - xt / d));
      }
      return 3*y1*t*(1-t)*(1-t) + 3*y2*t*t*(1-t) + t*t*t;
    };
  }
  const E = bez(0.22, 0.61, 0.36, 1), EIO = bez(0.65, 0, 0.35, 1);
  const clamp = v => Math.max(0, Math.min(1, v));
  const seg = (t, a, b, f = E) => f(clamp((t - a) / (b - a)));
  const lerp = (a, b, k) => a + (b - a) * k;
  const mix = (a, b, k) => 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',') + ')';

  const items = ['Accounts set up', 'Meet the team', 'First-week plan'];
  const ROW_Y = [356, 426, 496];
  const TICK = [0.6, 1.45, 2.3];
  const rowsEl = document.getElementById('rows');
  const rows = items.map((t, i) => {
    const r = document.createElement('div');
    r.className = 'abs row'; r.style.top = ROW_Y[i] + 'px';
    r.innerHTML = '<div class="box"><div class="ring"></div><div class="fill"></div>' +
      '<svg width="40" height="40" viewBox="0 0 40 40"><path d="M12.5 20.5l5 5 10-10.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="24"/></svg>' +
      '</div><span>' + t + '</span>';
    rowsEl.appendChild(r);
    return { fill: r.querySelector('.fill'), path: r.querySelector('path'), label: r.querySelector('span') };
  });
  const band = document.getElementById('band'), pill = document.getElementById('pill'), count = document.getElementById('count');
  const SEC = [107, 103, 99], INK = [20, 20, 19];

  // Poster offset: frame 0 shows the finished checklist with the pill.
  const OFFSET = 4.0;
  window.seek = function (sec) {
    const T = ((sec + OFFSET) % 6 + 6) % 6;
    let done = 0;
    rows.forEach((r, i) => {
      const t0 = TICK[i];
      const off = 1 - seg(T, 5.1 + 0.1 * i, 5.5 + 0.1 * i, EIO);
      const f = seg(T, t0, t0 + 0.3) * off;
      const c = seg(T, t0 + 0.12, t0 + 0.45) * off;
      r.fill.style.opacity = f.toFixed(3);
      r.fill.style.transform = 'scale(' + (0.6 + 0.4 * f).toFixed(4) + ')';
      r.path.style.strokeDashoffset = (24 * (1 - c)).toFixed(2);
      r.path.style.opacity = off.toFixed(3);
      r.label.style.color = mix(SEC, INK, f);
      if (T >= t0 + 0.15) done++;
    });
    // Counter: values only change while it is faded down during the reset.
    count.textContent = (T >= 5.45 ? 0 : done) + ' of 3';
    count.style.opacity = (1 - seg(T, 5.05, 5.35) + seg(T, 5.55, 5.85)).toFixed(3);
    count.style.color = mix(SEC, [133, 79, 11], seg(T, 2.45, 2.75) * (1 - seg(T, 5.05, 5.35)));
    // Active-row band travels down the list.
    let y = ROW_Y[0];
    for (let i = 0; i < 2; i++) y = lerp(y, ROW_Y[i + 1], seg(T, TICK[i] + 0.45, TICK[i] + 0.85, EIO));
    band.style.top = y.toFixed(2) + 'px';
    band.style.opacity = (seg(T, 0.2, 0.6) * (1 - seg(T, 2.8, 3.15))).toFixed(3);
    // Welcome pill rises in, holds, then settles away.
    const p = seg(T, 2.95, 3.55), q = seg(T, 5.0, 5.4, EIO);
    pill.style.opacity = (p * (1 - q)).toFixed(3);
    pill.style.transform = 'translate(-50%,' + ((1 - p) * 18 + q * 10).toFixed(2) + 'px)';
  };
  window.seek(0);
</script>
</body>
</html>
