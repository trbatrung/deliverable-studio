<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Training modules loop</title>
<script>window.SCENE = { name: 'portrait-training', width: 800, height: 800, fps: 30, duration: 6, kind: 'loop' };</script>
<style>
  html, body { width: 800px; height: 800px; margin: 0; overflow: hidden; background: #F7F4F1; }
  body { font-family: Inter, sans-serif; color: #141413; position: relative; }
  .abs { position: absolute; }
  .eyebrow { left: 0; right: 0; top: 168px; display: flex; justify-content: center; align-items: center; gap: 12px;
             font-size: 26px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #854F0B; }
  .eyebrow::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: #E8940A; }
  .card { left: 140px; width: 520px; height: 260px; margin-top: -130px; box-sizing: border-box; border-radius: 24px;
          background: #FCFBFA; border: 1.5px solid #DDD6CD; box-shadow: 0 12px 24px rgba(0,0,0,0.05);
          display: flex; align-items: center; gap: 36px; padding: 0 44px; overflow: hidden; transform-origin: 50% 0; }
  .card .dim { position: absolute; inset: 0; background: #F7F4F1; }
  .ring { position: relative; flex: 0 0 120px; height: 120px; }
  .ring svg { position: absolute; inset: 0; }
  .ring .play, .ring .tick { position: absolute; inset: 0; }
  .title { font-size: 46px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; }
  .sub { margin-top: 10px; font-size: 26px; color: #6B6763; }
  .dot { top: 632px; height: 12px; margin-left: -6px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="abs eyebrow">Course modules</div>
  <div id="stack"></div>
  <div id="dots"></div>
<script>
  function bez(x1, y1, x2, y2) {
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 10; i++) {
        const xt = 3*x1*t*(1-t)*(1-t) + 3*x2*t*t*(1-t) + t*t*t - x;
        const d = 3*x1*(1-t)*(1-t) + 6*(x2-x1)*t*(1-t) + 3*(1-x2)*t*t;
        if (Math.abs(d) < 1e-6) break;
        t = Math.min(1, Math.max(0, t - xt / d));
      }
      return 3*y1*t*(1-t)*(1-t) + 3*y2*t*t*(1-t) + t*t*t;
    };
  }
  const E = bez(0.22, 0.61, 0.36, 1), EIO = bez(0.65, 0, 0.35, 1);
  const clamp = v => Math.max(0, Math.min(1, v));
  const seg = (t, a, b, f = E) => f(clamp((t - a) / (b - a)));
  const lerp = (a, b, k) => a + (b - a) * k;

  const R = 52, C = 2 * Math.PI * R;
  const mods = [['Module 1', '4 lessons'], ['Module 2', '5 lessons'], ['Module 3', '3 lessons']];
  // Slots: front, middle, back. y is the card's top-centre anchor (cards are 260 tall).
  const SLOT = [{ y: 440, s: 1, d: 0 }, { y: 384, s: 0.92, d: 0.5 }, { y: 334, s: 0.84, d: 0.75 }];

  const stack = document.getElementById('stack');
  const cards = mods.map(([t, s]) => {
    const el = document.createElement('div');
    el.className = 'abs card';
    el.innerHTML =
      '<div class="ring"><svg width="120" height="120" viewBox="0 0 120 120">' +
      '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="#EDE6DD" stroke-width="9"/>' +
      '<circle class="arc" cx="60" cy="60" r="' + R + '" fill="none" stroke="#E8940A" stroke-width="9" stroke-linecap="round"' +
      ' stroke-dasharray="' + C.toFixed(2) + '" transform="rotate(-90 60 60)"/></svg>' +
      '<svg class="play" width="120" height="120" viewBox="0 0 120 120"><path d="M51 44.5v31l25-15.5z" fill="#141413" stroke="#141413" stroke-width="4" stroke-linejoin="round"/></svg>' +
      '<svg class="tick" width="120" height="120" viewBox="0 0 120 120"><path class="tp" d="M44 61l11 11 22-23" fill="none" stroke="#141413" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="50"/></svg>' +
      '</div><div><div class="title">' + t + '</div><div class="sub">' + s + '</div></div><div class="dim"></div>';
    stack.appendChild(el);
    return { el, arc: el.querySelector('.arc'), play: el.querySelector('.play'), tick: el.querySelector('.tick'),
             tp: el.querySelector('.tp'), dim: el.querySelector('.dim') };
  });
  const dotsEl = document.getElementById('dots');
  const dots = [0, 1, 2].map(() => { const d = document.createElement('div'); d.className = 'abs dot'; dotsEl.appendChild(d); return d; });

  function place(c, y, s, dim, op, z) {
    c.el.style.top = y.toFixed(2) + 'px';
    c.el.style.transform = 'scale(' + s.toFixed(4) + ')';
    c.el.style.opacity = op.toFixed(3);
    c.el.style.zIndex = z;
    c.dim.style.opacity = dim.toFixed(3);
  }
  const mixSlot = (a, b, k) => ({ y: lerp(a.y, b.y, k), s: lerp(a.s, b.s, k), d: lerp(a.d, b.d, k) });

  // Poster offset: frame 0 shows Module 1 complete.
  const OFFSET = 1.2;
  window.seek = function (sec) {
    const T = ((sec + OFFSET) % 6 + 6) % 6;
    cards.forEach((c, k) => {
      const u = ((T - 2 * k) % 6 + 6) % 6;
      let prog = 0, tick = 0;
      if (u < 1.4) {
        place(c, SLOT[0].y, 1, 0, 1, 3);
        prog = seg(u, 0.05, 0.85, EIO); tick = seg(u, 0.8, 1.1);
      } else if (u < 1.62) {
        const k2 = seg(u, 1.4, 1.62, EIO);
        place(c, SLOT[0].y + 28 * k2, 1, 0, 1 - k2, 4);
        prog = 1; tick = 1;
      } else if (u < 3.4) {
        const k2 = seg(u, 1.62, 2.0);
        place(c, SLOT[2].y - 24 * (1 - k2), SLOT[2].s, SLOT[2].d, k2, 1);
      } else if (u < 4.0) {
        const m = mixSlot(SLOT[2], SLOT[1], seg(u, 3.5, 4.0, EIO));
        place(c, m.y, m.s, m.d, 1, 2);
      } else if (u < 5.5) {
        place(c, SLOT[1].y, SLOT[1].s, SLOT[1].d, 1, 2);
      } else {
        const m = mixSlot(SLOT[1], SLOT[0], seg(u, 5.5, 6.0, EIO));
        place(c, m.y, m.s, m.d, 1, 3);
      }
      c.arc.style.strokeDashoffset = (C * (1 - prog)).toFixed(2);
      c.play.style.opacity = (1 - tick).toFixed(3);
      c.tick.style.opacity = tick.toFixed(3);
      c.tp.style.strokeDashoffset = (50 * (1 - tick)).toFixed(2);
    });
    // Dots: the active module's dot widens.
    const w = [0, 1, 2].map(k => {
      const u = ((T - 2 * k) % 6 + 6) % 6;
      if (u < 1.4) return 1;
      if (u < 2.0) return 1 - seg(u, 1.45, 2.0, EIO);
      if (u >= 5.5) return seg(u, 5.5, 6.0, EIO);
      return 0;
    });
    let x = 400 - (12 * 3 + 28 + 14 * 2) / 2;
    dots.forEach((d, k) => {
      const width = 12 + 28 * w[k];
      d.style.left = (x + 6) + 'px';
      d.style.width = width.toFixed(2) + 'px';
      d.style.background = 'rgb(' + [[221,232],[214,148],[205,10]].map(([a,b]) => Math.round(a + (b - a) * w[k])).join(',') + ')';
      d.style.opacity = 1;
      x += width + 14;
    });
  };
  window.seek(0);
</script>
</body>
</html>
