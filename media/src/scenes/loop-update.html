<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loop 02: update, weekly review</title>
<script>
  window.SCENE = { name: 'loop-update', width: 1280, height: 720, fps: 30, duration: 7.5, posterTime: 5.2, kind: 'loop', outWidth: 960, outHeight: 540, gif: { width: 640, fps: 15 } };
</script>
<style>
  /* Visual language copied from demo-explainer.html so the loop reads as a cut from a finished piece. */
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #F7F4F1; }
  body { font-family: Inter, sans-serif; color: #141413; position: relative; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  [data-in] { will-change: transform, opacity; }

  .eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #854F0B; }
  .eyebrow::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: #E8940A; flex-shrink: 0; }
  .h { font-weight: 500; letter-spacing: -0.02em; line-height: 1.12; margin: 0; }
  .pill { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; font-size: 22px; font-weight: 500; padding: 9px 22px; white-space: nowrap; }
  .pill.outline { background: #FCFBFA; border: 1.5px solid #DDD6CD; color: #6B6763; }
  .card { background: #FCFBFA; border-radius: 24px; box-shadow: 0 12px 24px rgba(0,0,0,0.06); }

  /* Persistent chrome: firm name and the concept label (no progress rail on site loops) */
  #chrome { position: absolute; inset: 0; pointer-events: none; }
  .top { position: absolute; top: 36px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: center; }
  .firm { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
  .firm i { width: 28px; height: 28px; border-radius: 50%; background: #141413; color: #F7F4F1; font-style: normal; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; }

  /* Two columns: title block left, simple five-week bar diagram right */
  #s-review { flex-direction: row; gap: 64px; padding-top: 8px; }
  .titleblock { width: 420px; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
  .titleblock .h { font-size: 60px; }
  .titleblock .sub { font-size: 26px; color: #6B6763; }
  .titleblock .rule { width: 64px; height: 4px; border-radius: 999px; background: #E8940A; margin-top: 8px; transform-origin: left center; }
  .chart { width: 600px; height: 420px; padding: 0 56px 34px; display: flex; flex-direction: column; justify-content: flex-end; }
  .bars { display: flex; align-items: flex-end; justify-content: space-between; height: 300px; border-bottom: 2px solid #DDD6CD; }
  .bar { position: relative; width: 72px; display: flex; justify-content: center; }
  .bar i { display: block; width: 100%; border-radius: 12px 12px 0 0; background: #D9D1C6; transform-origin: 50% 100%; }
  .bar.now i { background: #E8940A; }
  .labels { display: flex; justify-content: space-between; margin-top: 14px; }
  .labels span { width: 72px; text-align: center; font-size: 22px; font-weight: 500; color: #6B6763; }
  .labels span.now { color: #854F0B; }
  .callout { position: absolute; bottom: 100%; margin-bottom: 14px; left: 50%; }
  .callout .pill { background: #E8940A; color: #FCFBFA; font-size: 20px; padding: 7px 18px; }

  #cover { position: absolute; inset: 0; background: #F7F4F1; pointer-events: none; }
</style>
</head>
<body>

<div id="chrome">
  <div class="top">
    <div class="firm"><i>H</i>Harbour Lane</div>
    <div class="pill outline">Concept piece</div>
  </div>
</div>

<section class="scene" id="s-review">
  <div class="titleblock">
    <div class="eyebrow tb">Week 5 &middot; Q2</div>
    <h2 class="h tb">Sales results</h2>
    <div class="sub tb">Approved highlights</div>
    <div class="rule" id="rule"></div>
  </div>
  <div class="card chart">
    <div class="bars">
      <div class="bar"><i style="height:132px"></i></div>
      <div class="bar"><i style="height:168px"></i></div>
      <div class="bar"><i style="height:150px"></i></div>
      <div class="bar"><i style="height:194px"></i></div>
      <div class="bar now"><i id="b5" style="height:236px"></i><div class="callout" id="call"><span class="pill">Week 5</span></div></div>
    </div>
    <div class="labels"><span>W1</span><span>W2</span><span>W3</span><span>W4</span><span class="now" id="l5">W5</span></div>
  </div>
</section>

<div id="cover"></div>

<script>
  function bez(x1, y1, x2, y2) {
    return x => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 10; i++) {
        const cx = 3*x1*t*(1-t)*(1-t) + 3*x2*t*t*(1-t) + t*t*t - x;
        const dx = 3*x1*(1-t)*(1-t) + 6*(x2-x1)*t*(1-t) + 3*(1-x2)*t*t;
        if (Math.abs(cx) < 1e-6 || Math.abs(dx) < 1e-6) break;
        t = Math.min(1, Math.max(0, t - cx/dx));
      }
      return 3*y1*t*(1-t)*(1-t) + 3*y2*t*t*(1-t) + t*t*t;
    };
  }
  const E = bez(0.22, 0.61, 0.36, 1);
  const prog = (t, a, d) => t <= a ? 0 : t >= a + d ? 1 : E((t - a) / d);
  const lin = (t, a, d) => t <= a ? 0 : t >= a + d ? 1 : (t - a) / d;

  const scene = document.getElementById('s-review');
  const bars = [...document.querySelectorAll('.bar i')];
  const label5 = document.getElementById('l5');
  const call = document.getElementById('call');
  const rule = document.getElementById('rule');
  const tbs = [...document.querySelectorAll('.tb')];
  const cover = document.getElementById('cover');
  const DUR = window.SCENE.duration;

  window.seek = function (t) {
    // A slow, steady push-in over the whole loop so nothing ever sits still.
    // At t = 0 and t = DUR the cover hides everything, so the reset is unseen.
    scene.style.transform = `scale(${1 + 0.035 * lin(t, 0, DUR)})`;

    // Title block builds in, then its amber rule draws.
    tbs.forEach((el, i) => {
      const k = prog(t, 0.2 + 0.2 * i, 0.6);
      el.style.opacity = k;
      el.style.transform = `translateY(${(1 - k) * 18}px)`;
    });
    rule.style.transform = `scaleX(${prog(t, 0.8, 0.6)})`;

    // Weeks 1 to 4 grow in turn, then Week 5 rises in amber, its label lands
    // and the callout settles above it.
    bars.forEach((el, i) => {
      const k = i < 4 ? prog(t, 0.9 + 0.3 * i, 0.7) : prog(t, 2.5, 0.9);
      el.style.transform = `scaleY(${k})`;
      el.style.opacity = k > 0 ? 1 : 0;
    });
    const l = prog(t, 3.0, 0.5);
    label5.style.opacity = l;
    label5.style.transform = `translateY(${(1 - l) * 12}px)`;
    const c = prog(t, 3.6, 0.5);
    call.style.opacity = c;
    call.style.transform = `translateX(-50%) translateY(${(1 - c) * 14}px) scale(${0.9 + 0.1 * c})`;

    // Scene change the explainer way: content fades to cream over 0.4 s.
    scene.style.opacity = 1 - prog(t, 6.8, 0.4);

    // 0.25 s fade from and to the canvas colour, matching the sibling excerpts.
    cover.style.opacity = Math.max(1 - lin(t, 0, 0.25), lin(t, DUR - 0.25, 0.25));
  };
  window.seek(0);
</script>
</body>
</html>
